<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Live Sales Tracker</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --accent: #4f8cff;
    --accent-dark: #3a6fd8;
    --text: #f2f3f5;
    --muted: #9aa0ac;
    --danger: #ff5c5c;
    --success: #35c56a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 16px 8px;
    text-align: center;
    position: relative;
  }
  header h1 {
    font-size: 1.3rem;
    margin: 0 0 4px;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.85rem;
  }
  #settingsBtn {
    position: absolute;
    top: 14px;
    right: 16px;
    background: var(--card);
    border: none;
    color: var(--muted);
    width: 34px;
    height: 34px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
  }

  /* ---- staff selector ---- */
  #staffSelector {
    margin: 14px 16px 0;
    display: flex;
    gap: 10px;
  }
  #staffSelector button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  #staffSelector button.active {
    background: var(--accent);
    color: white;
  }

  /* ---- lock screen ---- */
  #lockNotice {
    margin: 14px 16px 0;
    background: var(--card);
    border-radius: 12px;
    padding: 20px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 0.88rem;
    display: none;
  }
  #lockNotice.show { display: block; }

  #mainContent { display: none; }
  #mainContent.show { display: block; }

  #switchUserRow {
    margin: 10px 16px 0;
    display: none;
  }
  #switchUserRow.show { display: block; }
  #switchUserRow button {
    width: 100%;
    padding: 8px;
    border: none;
    border-radius: 8px;
    background: #2a2e38;
    color: var(--muted);
    font-size: 0.78rem;
    cursor: pointer;
  }

  /* ---- summary cards ---- */
  #summary {
    margin: 14px 16px 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  #summary .card {
    background: var(--card);
    border-radius: 12px;
    padding: 12px 14px;
  }
  #summary .card .label {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-weight: 700;
  }
  #summary .card .value {
    font-size: 1.25rem;
    font-weight: 800;
    margin-top: 4px;
  }
  #summary .card.commission .value { color: var(--accent); }

  /* ---- entry form ---- */
  #form-card {
    margin: 14px 16px 0;
    background: var(--card);
    border-radius: 14px;
    padding: 16px;
  }
  #form-card h2 {
    font-size: 0.95rem;
    margin: 0 0 12px;
  }
  .field-wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 12px;
  }
  .field-wrap label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent);
  }
  .field-wrap input, .field-wrap select {
    background: #11141b;
    border: 1px solid #2a2e38;
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.95rem;
    width: 100%;
  }
  #commissionPreview {
    background: #11141b;
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 0.9rem;
  }
  #commissionPreview .amt {
    font-weight: 800;
    color: var(--accent);
    font-size: 1.05rem;
  }
  #addBtn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 0.98rem;
    font-weight: 700;
    cursor: pointer;
  }
  #addBtn:active { opacity: 0.8; }
  #status {
    padding: 8px 16px 0;
    min-height: 18px;
    text-align: center;
    font-size: 0.82rem;
    color: var(--muted);
  }
  #status.ok { color: var(--success); }
  #status.err { color: var(--danger); }
  #syncNote {
    padding: 4px 16px 0;
    text-align: center;
    font-size: 0.72rem;
    color: var(--muted);
  }

  /* ---- history ---- */
  section#history {
    margin: 18px 16px 28px;
  }
  #history-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    gap: 8px;
  }
  #history-head h2 {
    font-size: 1rem;
    margin: 0;
  }
  #history-actions { display: flex; gap: 8px; }
  #history-actions button {
    flex: none;
    padding: 7px 12px;
    font-size: 0.78rem;
    border: none;
    border-radius: 8px;
    background: #2a2e38;
    color: var(--text);
    cursor: pointer;
  }
  #history-actions #clearBtn { background: #3a1f22; color: var(--danger); }

  #filterRow {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  #filterRow select {
    flex: 1;
    background: var(--card);
    border: 1px solid #2a2e38;
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.85rem;
  }

  ul#entryList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  ul#entryList li {
    background: var(--card);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  ul#entryList li .info { min-width: 0; flex: 1; }
  ul#entryList li .staffName {
    font-weight: 800;
    font-size: 0.98rem;
  }
  ul#entryList li .storeTag {
    display: inline-block;
    background: #11141b;
    color: var(--accent);
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 6px;
    margin-left: 6px;
    vertical-align: middle;
  }
  ul#entryList li .dt {
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 2px;
  }
  ul#entryList li .amts {
    display: flex;
    gap: 14px;
    margin-top: 6px;
    font-size: 0.85rem;
  }
  ul#entryList li .amts .sales { font-weight: 700; }
  ul#entryList li .amts .comm { color: var(--accent); font-weight: 700; }
  ul#entryList li .item-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: none;
  }
  ul#entryList li .item-actions button {
    background: transparent;
    border: none;
    color: var(--muted);
    flex: none;
    padding: 4px 8px;
    font-size: 0.9rem;
    line-height: 1;
    cursor: pointer;
  }
  ul#entryList li .item-actions button.del { color: var(--danger); }
  ul#entryList li .item-actions button.edit { color: var(--accent); }
  #empty {
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    padding: 24px 0;
  }

  /* ---- edit row (reuses entry li) ---- */
  .edit-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .edit-row .field-wrap { margin-bottom: 0; }
  .edit-row .edit-buttons {
    display: flex;
    gap: 8px;
  }
  .edit-row .edit-buttons button {
    flex: 1;
    padding: 8px 10px;
    font-size: 0.8rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .edit-row .save-btn { background: var(--accent); color: white; }
  .edit-row .cancel-btn { background: #2a2e38; color: var(--text); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>📊 Live Sales Tracker</h1>
    <p>Key in your sales for each live</p>
    <button id="settingsBtn" title="Settings">⚙</button>
  </header>

  <div id="staffSelector">
    <button id="staffParvana" data-name="Parvana">Parvana</button>
    <button id="staffGhandi" data-name="Ghandi">Ghandi</button>
    <button id="staffThurga" data-name="Thurga">Thurga</button>
  </div>

  <div id="lockNotice">🔒 Select your name above and enter your PIN to see and log your sales. Your numbers stay private from the other staff members.</div>

  <div id="switchUserRow"><button id="switchUserBtn">Switch user / Lock</button></div>

  <div id="mainContent">
    <div id="summary">
      <div class="card">
        <div class="label">Total Sales</div>
        <div class="value" id="sumSales">RM 0.00</div>
      </div>
      <div class="card commission">
        <div class="label">Total Commission</div>
        <div class="value" id="sumCommission">RM 0.00</div>
      </div>
    </div>

    <div id="form-card">
      <h2>Log a Live</h2>

      <div class="field-wrap">
        <label for="storeInput">Store</label>
        <select id="storeInput">
          <option value="">Select store...</option>
          <option value="SHP">SHP</option>
          <option value="N2">N2</option>
          <option value="VD4U">VD4U</option>
          <option value="COI">COI</option>
        </select>
      </div>

      <div class="field-wrap">
        <label for="dateInput">Date</label>
        <input type="date" id="dateInput" />
      </div>

      <div class="field-wrap">
        <label for="liveStartInput">Live Start</label>
        <input type="time" id="liveStartInput" />
      </div>

      <div class="field-wrap">
        <label for="liveEndInput">Live End</label>
        <input type="time" id="liveEndInput" />
      </div>

      <div class="field-wrap">
        <label for="salesInput">Total Sales (RM)</label>
        <input type="number" id="salesInput" placeholder="e.g. 250.00" min="0" step="0.01" inputmode="decimal" />
      </div>

      <div id="commissionPreview">
        <span>Commission (2%)</span>
        <span class="amt" id="commissionPreviewAmt">RM 0.00</span>
      </div>

      <button id="addBtn">+ Add Entry</button>
    </div>
    <div id="status"></div>
    <div id="syncNote"></div>

    <section id="history">
      <div id="history-head">
        <h2>Sales Log</h2>
        <div id="history-actions">
          <button id="exportBtn">Export CSV</button>
          <button id="clearBtn">Clear</button>
        </div>
      </div>
      <div id="filterRow">
        <select id="storeFilter">
          <option value="">All Stores</option>
          <option value="SHP">SHP</option>
          <option value="N2">N2</option>
          <option value="VD4U">VD4U</option>
          <option value="COI">COI</option>
        </select>
      </div>
      <ul id="entryList"></ul>
      <div id="empty">No sales logged yet</div>
    </section>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = "liveSalesEntries";
  const SHEET_URL_KEY = "liveSalesSheetUrl";
  const PIN_PREFIX = "liveSalesPin_";
  const COMMISSION_RATE = 0.02;
  const STAFF_NAMES = ["Parvana", "Ghandi", "Thurga"];

  const settingsBtn = document.getElementById("settingsBtn");
  const staffButtons = {
    Parvana: document.getElementById("staffParvana"),
    Ghandi: document.getElementById("staffGhandi"),
    Thurga: document.getElementById("staffThurga")
  };
  const lockNotice = document.getElementById("lockNotice");
  const switchUserRow = document.getElementById("switchUserRow");
  const switchUserBtn = document.getElementById("switchUserBtn");
  const mainContent = document.getElementById("mainContent");

  const storeInput = document.getElementById("storeInput");
  const dateInput = document.getElementById("dateInput");
  const liveStartInput = document.getElementById("liveStartInput");
  const liveEndInput = document.getElementById("liveEndInput");
  const salesInput = document.getElementById("salesInput");
  const commissionPreviewAmt = document.getElementById("commissionPreviewAmt");
  const addBtn = document.getElementById("addBtn");
  const statusEl = document.getElementById("status");
  const syncNoteEl = document.getElementById("syncNote");
  const entryList = document.getElementById("entryList");
  const emptyEl = document.getElementById("empty");
  const sumSalesEl = document.getElementById("sumSales");
  const sumCommissionEl = document.getElementById("sumCommission");
  const exportBtn = document.getElementById("exportBtn");
  const clearBtn = document.getElementById("clearBtn");
  const storeFilter = document.getElementById("storeFilter");

  let unlockedStaff = null; // null = locked, nothing visible
  let editingId = null;

  // ---------------- PIN privacy ----------------
  function unlockStaff(name) {
    const pinKey = PIN_PREFIX + name;
    const savedPin = localStorage.getItem(pinKey);

    if (!savedPin) {
      const newPin = prompt("First time setup for " + name + ".\nCreate a PIN (4+ characters) to keep your sales private from " + otherStaff(name) + ":");
      if (newPin === null) return false;
      if (newPin.trim().length < 4) {
        alert("PIN must be at least 4 characters. Please try again.");
        return false;
      }
      const confirmPin = prompt("Confirm your PIN:");
      if (confirmPin === null) return false;
      if (confirmPin.trim() !== newPin.trim()) {
        alert("PINs didn't match. Please try again.");
        return false;
      }
      localStorage.setItem(pinKey, newPin.trim());
      return true;
    } else {
      const entered = prompt(name + ", enter your PIN:");
      if (entered === null) return false;
      if (entered.trim() !== savedPin) {
        alert("Incorrect PIN.");
        return false;
      }
      return true;
    }
  }

  function otherStaff(name) {
    return STAFF_NAMES.filter((n) => n !== name).join(" and ") || "the other staff";
  }

  function lockAll() {
    unlockedStaff = null;
    Object.keys(staffButtons).forEach((key) => staffButtons[key].classList.remove("active"));
    lockNotice.classList.add("show");
    switchUserRow.classList.remove("show");
    mainContent.classList.remove("show");
    setStatus("", "");
  }

  function selectStaff(name) {
    const ok = unlockStaff(name);
    if (!ok) return;
    unlockedStaff = name;
    Object.keys(staffButtons).forEach((key) => {
      staffButtons[key].classList.toggle("active", key === name);
    });
    lockNotice.classList.remove("show");
    switchUserRow.classList.add("show");
    mainContent.classList.add("show");
    renderEntries();
    renderSummary();
    setStatus("", "");
  }

  // ---------------- Google Sheet sync ----------------
  function getSheetUrl() {
    return localStorage.getItem(SHEET_URL_KEY) || "";
  }

  function openSettings() {
    const current = getSheetUrl();
    const url = prompt(
      "Paste the Google Apps Script Web App URL to sync sales to your Google Sheet.\nLeave blank and press OK to remove it.",
      current
    );
    if (url === null) return;
    if (url.trim()) {
      localStorage.setItem(SHEET_URL_KEY, url.trim());
      alert("Saved. New entries on this device will now sync to your Sheet.");
    } else {
      localStorage.removeItem(SHEET_URL_KEY);
      alert("Sheet sync removed for this device.");
    }
    updateSyncNote();
  }

  function updateSyncNote() {
    syncNoteEl.textContent = getSheetUrl()
      ? "Syncing to your Google Sheet ✓"
      : "Not syncing to a Sheet yet — tap ⚙ to set it up";
  }

  function syncToSheet(entry) {
    const url = getSheetUrl();
    if (!url) return;
    fetch(url, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(entry)
    }).catch(() => {
      /* silent — entry is still saved locally */
    });
  }

  // ---------------- data ----------------
  function money(n) {
    const v = isNaN(n) ? 0 : n;
    return "RM " + v.toFixed(2);
  }

  function loadEntries() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    } catch (e) {
      return [];
    }
  }

  function saveEntries(entries) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  function updateEntry(id, changes) {
    const entries = loadEntries();
    const idx = entries.findIndex((e) => e.id === id);
    if (idx === -1) return;
    entries[idx] = Object.assign({}, entries[idx], changes);
    saveEntries(entries);
  }

  function todayStr() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function nowTimeStr() {
    const d = new Date();
    const h = String(d.getHours()).padStart(2, "0");
    const m = String(d.getMinutes()).padStart(2, "0");
    return h + ":" + m;
  }

  function setStatus(msg, kind) {
    statusEl.textContent = msg || "";
    statusEl.className = kind ? kind : "";
  }

  function updateCommissionPreview() {
    const val = parseFloat(salesInput.value);
    const commission = isNaN(val) ? 0 : val * COMMISSION_RATE;
    commissionPreviewAmt.textContent = money(commission);
  }

  // entries visible to the currently unlocked staff only
  function myEntries() {
    return loadEntries().filter((e) => e.staff === unlockedStaff);
  }

  function renderSummary() {
    if (!unlockedStaff) return;
    let totalSales = 0;
    let totalCommission = 0;
    myEntries().forEach((e) => {
      totalSales += e.sales || 0;
      totalCommission += e.commission || 0;
    });
    sumSalesEl.textContent = money(totalSales);
    sumCommissionEl.textContent = money(totalCommission);
  }

  function fmtDate(dateStr) {
    if (!dateStr) return "";
    const parts = dateStr.split("-");
    if (parts.length !== 3) return dateStr;
    return parts[2] + "/" + parts[1] + "/" + parts[0];
  }

  function renderEntries() {
    if (!unlockedStaff) return;
    let entries = myEntries().slice().sort((a, b) => b.createdAt - a.createdAt);

    const filter = storeFilter.value;
    if (filter) {
      entries = entries.filter((e) => e.store === filter);
    }

    entryList.innerHTML = "";
    if (entries.length === 0) {
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    entries.forEach((entry) => {
      const li = document.createElement("li");

      if (editingId === entry.id) {
        // ---- edit mode ----
        const row = document.createElement("div");
        row.className = "edit-row";

        function field(labelText, type, value, extra) {
          const wrap = document.createElement("div");
          wrap.className = "field-wrap";
          const label = document.createElement("label");
          label.textContent = labelText;
          const input = document.createElement("input");
          input.type = type;
          input.value = value;
          if (extra) Object.assign(input, extra);
          wrap.appendChild(label);
          wrap.appendChild(input);
          return { wrap, input };
        }

        const storeWrap = document.createElement("div");
        storeWrap.className = "field-wrap";
        const storeLabel = document.createElement("label");
        storeLabel.textContent = "Store";
        const storeSelect = document.createElement("select");
        ["SHP", "N2", "VD4U", "COI"].forEach((s) => {
          const opt = document.createElement("option");
          opt.value = s;
          opt.textContent = s;
          if (s === entry.store) opt.selected = true;
          storeSelect.appendChild(opt);
        });
        storeWrap.appendChild(storeLabel);
        storeWrap.appendChild(storeSelect);

        const dateField = field("Date", "date", entry.date);
        const liveStartField = field("Live Start", "time", entry.liveStart);
        const liveEndField = field("Live End", "time", entry.liveEnd);
        const salesField = field("Total Sales (RM)", "number", entry.sales, { min: "0", step: "0.01" });

        const btnRow = document.createElement("div");
        btnRow.className = "edit-buttons";

        const saveBtn = document.createElement("button");
        saveBtn.className = "save-btn";
        saveBtn.textContent = "Save";
        saveBtn.addEventListener("click", () => {
          const newSales = parseFloat(salesField.input.value);
          const finalSales = isNaN(newSales) || newSales < 0 ? entry.sales : newSales;
          const changes = {
            store: storeSelect.value,
            date: dateField.input.value || entry.date,
            liveStart: liveStartField.input.value || entry.liveStart,
            liveEnd: liveEndField.input.value || entry.liveEnd,
            sales: finalSales,
            commission: Math.round(finalSales * COMMISSION_RATE * 100) / 100
          };
          updateEntry(entry.id, changes);
          syncToSheet(Object.assign({}, entry, changes, { edited: true }));
          editingId = null;
          renderEntries();
          renderSummary();
        });

        const cancelBtn = document.createElement("button");
        cancelBtn.className = "cancel-btn";
        cancelBtn.textContent = "Cancel";
        cancelBtn.addEventListener("click", () => {
          editingId = null;
          renderEntries();
        });

        btnRow.appendChild(saveBtn);
        btnRow.appendChild(cancelBtn);
        row.appendChild(storeWrap);
        row.appendChild(dateField.wrap);
        row.appendChild(liveStartField.wrap);
        row.appendChild(liveEndField.wrap);
        row.appendChild(salesField.wrap);
        row.appendChild(btnRow);
        li.appendChild(row);
      } else {
        // ---- display mode ----
        const info = document.createElement("div");
        info.className = "info";

        const nameDiv = document.createElement("div");
        nameDiv.className = "staffName";
        nameDiv.textContent = entry.staff;
        if (entry.store) {
          const tag = document.createElement("span");
          tag.className = "storeTag";
          tag.textContent = entry.store;
          nameDiv.appendChild(tag);
        }

        const liveRange = entry.liveStart && entry.liveEnd
          ? entry.liveStart + " – " + entry.liveEnd
          : (entry.liveStart || entry.liveEnd || "");

        const dtDiv = document.createElement("div");
        dtDiv.className = "dt";
        dtDiv.textContent = fmtDate(entry.date) + " · " + liveRange;

        const amtsDiv = document.createElement("div");
        amtsDiv.className = "amts";
        const salesSpan = document.createElement("span");
        salesSpan.className = "sales";
        salesSpan.textContent = "Sales: " + money(entry.sales);
        const commSpan = document.createElement("span");
        commSpan.className = "comm";
        commSpan.textContent = "Comm: " + money(entry.commission);
        amtsDiv.appendChild(salesSpan);
        amtsDiv.appendChild(commSpan);

        info.appendChild(nameDiv);
        info.appendChild(dtDiv);
        info.appendChild(amtsDiv);

        const actions = document.createElement("div");
        actions.className = "item-actions";

        const editBtn = document.createElement("button");
        editBtn.className = "edit";
        editBtn.textContent = "✎";
        editBtn.addEventListener("click", () => {
          editingId = entry.id;
          renderEntries();
        });

        const delBtn = document.createElement("button");
        delBtn.className = "del";
        delBtn.textContent = "✕";
        delBtn.addEventListener("click", () => {
          const remaining = loadEntries().filter((e) => e.id !== entry.id);
          saveEntries(remaining);
          renderEntries();
          renderSummary();
        });

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);

        li.appendChild(info);
        li.appendChild(actions);
      }

      entryList.appendChild(li);
    });
  }

  function addEntry() {
    if (!unlockedStaff) return;
    if (!storeInput.value) {
      setStatus("Select a store", "err");
      return;
    }
    const sales = parseFloat(salesInput.value);
    if (isNaN(sales) || sales < 0) {
      setStatus("Enter a valid sales amount", "err");
      return;
    }
    const date = dateInput.value || todayStr();
    const liveStart = liveStartInput.value || nowTimeStr();
    const liveEnd = liveEndInput.value || "";
    const commission = Math.round(sales * COMMISSION_RATE * 100) / 100;

    const entry = {
      id: Date.now() + "-" + Math.random().toString(36).slice(2),
      staff: unlockedStaff,
      store: storeInput.value,
      date: date,
      liveStart: liveStart,
      liveEnd: liveEnd,
      sales: sales,
      commission: commission,
      createdAt: Date.now()
    };

    const entries = loadEntries();
    entries.push(entry);
    saveEntries(entries);
    syncToSheet(entry);

    salesInput.value = "";
    storeInput.value = "";
    liveEndInput.value = "";
    updateCommissionPreview();
    renderEntries();
    renderSummary();
    setStatus(unlockedStaff + "'s sale of " + money(sales) + " logged (commission " + money(commission) + ")", "ok");
  }

  function exportCsv() {
    if (!unlockedStaff) return;
    const entries = myEntries().slice().sort((a, b) => a.createdAt - b.createdAt);
    if (entries.length === 0) {
      setStatus("Nothing to export", "err");
      return;
    }
    let csv = "staff,store,date,live_start,live_end,total_sales,commission\n";
    entries.forEach((e) => {
      csv += `"${e.staff}","${e.store || ""}","${e.date}","${e.liveStart || ""}","${e.liveEnd || ""}","${e.sales.toFixed(2)}","${e.commission.toFixed(2)}"\n`;
    });
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "live-sales-" + unlockedStaff.toLowerCase() + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  settingsBtn.addEventListener("click", openSettings);
  staffButtons.Parvana.addEventListener("click", () => selectStaff("Parvana"));
  staffButtons.Ghandi.addEventListener("click", () => selectStaff("Ghandi"));
  staffButtons.Thurga.addEventListener("click", () => selectStaff("Thurga"));
  switchUserBtn.addEventListener("click", lockAll);
  salesInput.addEventListener("input", updateCommissionPreview);
  addBtn.addEventListener("click", addEntry);
  exportBtn.addEventListener("click", exportCsv);
  clearBtn.addEventListener("click", () => {
    if (!unlockedStaff) return;
    if (confirm("Clear all of " + unlockedStaff + "'s logged sales on this device? This cannot be undone.")) {
      const remaining = loadEntries().filter((e) => e.staff !== unlockedStaff);
      saveEntries(remaining);
      renderEntries();
      renderSummary();
    }
  });
  storeFilter.addEventListener("change", renderEntries);

  // defaults
  dateInput.value = todayStr();
  liveStartInput.value = nowTimeStr();
  updateCommissionPreview();
  updateSyncNote();
  lockAll();
})();
</script>
</body>
</html>
